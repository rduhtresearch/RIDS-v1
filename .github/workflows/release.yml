name: Release Artifact

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libsodium-dev

      - name: Install R packages
        run: Rscript -e 'options(Ncpus = 2); source("R/dependencies.R")'

      - name: Run CI checks
        run: Rscript R/CI/run_ci_checks.R

      - name: Build release archive
        run: git archive --format=zip --output "rids-${{ github.ref_name }}.zip" "${{ github.ref_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rids-${{ github.ref_name }}
          path: rids-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rids-${{ github.ref_name }}.zip
