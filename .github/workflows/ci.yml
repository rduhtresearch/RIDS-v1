name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libsodium-dev

      - name: Install R packages
        run: Rscript -e 'options(Ncpus = 2); source("R/dependencies.R")'

      - name: Run CI checks
        run: Rscript R/CI/run_ci_checks.R
